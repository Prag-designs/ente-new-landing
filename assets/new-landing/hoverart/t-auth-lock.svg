<svg xmlns="http://www.w3.org/2000/svg" width="305.5" height="382.7" fill="none" viewBox="56.5 55.8 305.5 382.7">
  <!-- Auth lock, hand drawn in the Locker style: black outline, dark side, white strip inside the top-left edges -->
  <defs><clipPath id="t-auth-lock-face"><rect x="70" y="180" width="250" height="220" rx="32"/></clipPath></defs>
  <g transform="rotate(4 195 290)">
    <!-- shackle: outline, face, white strip on its outer left and top -->
    <path d="M143.5 215V138A50 50 0 0 1 193.5 88H245.5A50 50 0 0 1 295.5 138V215" stroke="#0D0D0D" stroke-width="61"/>
    <path d="M143.5 215V138A50 50 0 0 1 193.5 88H245.5A50 50 0 0 1 295.5 138V215" stroke="#8A18DB" stroke-width="49"/>
    <path d="M122 205V138A71.5 71.5 0 0 1 193.5 66.5H252" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- body: dark side, then the front face -->
    <rect x="100" y="202" width="250" height="220" rx="32" fill="#4D0B7A" stroke="#0D0D0D" stroke-width="12"/>
    <rect x="70" y="180" width="250" height="220" rx="32" fill="#8A18DB"/>
    <g clip-path="url(#t-auth-lock-face)">
      <rect x="70" y="180" width="250" height="220" rx="32" stroke="#fff" stroke-width="24"/>
      <rect x="82" y="192" width="250" height="220" rx="32" fill="#8A18DB"/>
    </g>
    <rect x="70" y="180" width="250" height="220" rx="32" stroke="#0D0D0D" stroke-width="12"/>
    <!-- keyhole -->
    <path d="M187.1 299.9A33 33 0 1 1 214.9 299.9L226 350Q228 362 216 362H186Q174 362 176 350Z" fill="#fff" stroke="#0D0D0D" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
